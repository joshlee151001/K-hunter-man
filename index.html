<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-사냥맨</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; background: #0b0b14; color: #fff; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; max-width: 520px; margin: 0 auto; background: #12121f; overflow: hidden; }

  #home { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #profileBar { display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #1a1a2e; border-bottom: 2px solid #2a2a44; }
  #profileBar img { width: 40px; height: 40px; border: 2px solid #ffd84a; border-radius: 4px; image-rendering: pixelated; background: #333; object-fit: cover; }
  #profileBar .nm { font-weight: bold; color: #ffd84a; font-size: 15px; }
  #profileBar .num { color: #888; font-size: 11px; }
  #profileBar .tr { margin-left: auto; color: #ffd84a; font-size: 13px; }
  #syncDot { width: 8px; height: 8px; background: #7CFC7C; border-radius: 50%; margin-left: 6px; }
  #syncDot.pending { background: #f80; animation: pulse 1s infinite; }
  #syncDot.error { background: #f33; }
  @keyframes pulse { 50% { opacity: .3; } }
  .inp { width: 100%; padding: 10px; font-size: 15px; background: #0b0b14; color: #fff; border: 2px solid #3a3a5c; margin: 4px 0 12px; }
  .inp:focus { outline: none; border-color: #ffd84a; }
  .pwwrap { position: relative; }
  .pwwrap .inp { padding-right: 40px; }
  .pwwrap .eye { position: absolute; right: 10px; top: 14px; cursor: pointer; font-size: 18px; user-select: none; opacity: .8; }
  .pwwrap .eye.off { opacity: .35; }
  .avgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 6px 0; }
  .avgrid img { width: 100%; aspect-ratio: 1; border: 3px solid #3a3a5c; background: #222; cursor: pointer; image-rendering: pixelated; }
  .avgrid img.sel { border-color: #ffd84a; box-shadow: 0 0 8px #ffd84a; }
  .avprev { width: 64px; height: 64px; border: 3px solid #ffd84a; background: #333; object-fit: cover; image-rendering: pixelated; }
  #profileBar { cursor: pointer; }
  #topbar { display: flex; gap: 6px; padding: 10px 10px 6px; background: #0b0b14; border-bottom: 3px solid #2a2a44; font-size: 13px; }
  .res { flex: 1; background: #1c1c30; border: 2px solid #3a3a5c; padding: 5px 6px; text-align: center; white-space: nowrap; }
  .res b { color: #ffd84a; }
  #tabcontent { flex: 1; overflow-y: auto; padding: 14px; }
  #tabs { display: flex; height: 62px; background: #0b0b14; border-top: 3px solid #2a2a44; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #8a8ab0; cursor: pointer; gap: 3px; }
  .tab .ico { font-size: 22px; }
  .tab.active { color: #ffd84a; background: #1c1c30; }
  .tab.home-tab .ico { font-size: 28px; }
  h2 { font-size: 20px; color: #7CFC7C; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; letter-spacing: 1px; }
  .card { background: #1c1c30; border: 3px solid #3a3a5c; padding: 12px; margin-bottom: 12px; box-shadow: 4px 4px 0 #000; }
  .card h3 { font-size: 15px; color: #ffd84a; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #c8c8e0; line-height: 1.5; }
  .btn { display: inline-block; background: #3b8f3b; color: #fff; border: 3px solid #fff; padding: 10px 18px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 #000; margin-top: 8px; }
  .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  .btn.big { width: 100%; padding: 16px; font-size: 20px; background: #d9432f; text-align: center; }
  .btn.gold { background: #b58a1c; }
  .btn.blue { background: #2f6fd9; }
  .btn.gray, .btn:disabled, .btn.disabled { background: #444; color: #999; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pixel-title { font-size: 34px; font-weight: 900; color: #7CFC7C; text-shadow: 4px 4px 0 #000, -2px -2px 0 #1a4d1a; letter-spacing: 2px; text-align: center; margin: 10px 0 4px; }
  .sub { text-align: center; color: #8a8ab0; font-size: 13px; margin-bottom: 14px; }
  #heroCanvas { display: block; margin: 0 auto 8px; image-rendering: pixelated; background: #1a1a2a; border: 3px solid #3a3a5c; }
  .stat { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px dashed #3a3a5c; }
  .stars { color: #ffd84a; font-size: 18px; letter-spacing: 2px; }
  .bar { height: 14px; background: #0b0b14; border: 2px solid #3a3a5c; margin: 6px 0; position: relative; }
  .bar > div { height: 100%; background: #7CFC7C; }
  .shop-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .shop-item .ico { font-size: 30px; }
  .small { font-size: 12px; color: #8a8ab0; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #3a3a5c; font-size: 15px; }
  .sw { width: 54px; height: 28px; background: #444; border: 2px solid #fff; position: relative; cursor: pointer; }
  .sw.on { background: #3b8f3b; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; transition: left .15s; }
  .sw.on::after { left: 28px; }
  .skilltbl { width: 100%; font-size: 12px; border-collapse: collapse; }
  .skilltbl td { padding: 4px 3px; border-bottom: 1px solid #2a2a44; vertical-align: top; }
  .skilltbl td:first-child { white-space: nowrap; color: #ffd84a; }
  .hidden { display: none !important; }
  .toast { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); background: #000; color: #ffd84a; border: 3px solid #ffd84a; padding: 10px 16px; font-weight: bold; font-size: 14px; z-index: 50; white-space: nowrap; box-shadow: 4px 4px 0 #000; pointer-events: none; }

  #battle { position: absolute; inset: 0; background: #000; }
  #game { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 10px; pointer-events: none; }
  #hpbar { height: 16px; background: #300; border: 2px solid #fff; position: relative; }
  #hpfill { height: 100%; background: #e33; }
  #gembar { height: 10px; background: #013; border: 2px solid #fff; margin-top: 4px; position: relative; }
  #gemfill { height: 100%; background: #4af; }
  #hudtxt { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; text-shadow: 1px 1px 0 #000; }
  #timer { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 900; text-shadow: 2px 2px 0 #000; pointer-events: none; }
  #skillrow { position: absolute; top: 58px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60%; pointer-events: none; }
  .sk { width: 32px; height: 32px; background: rgba(0,0,0,.7); border: 2px solid #888; font-size: 16px; display: flex; align-items: center; justify-content: center; position: relative; }
  .sk .lv { position: absolute; bottom: -2px; right: -2px; background: #000; color: #ffd84a; font-size: 9px; padding: 0 2px; font-weight: bold; }
  .sk.def { border-color: #4af; }
  .sk.sup { border-color: #ffd84a; box-shadow: 0 0 8px #ffd84a; }
  #superBtn { position: absolute; right: 14px; bottom: 90px; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(#ff8a2a, #b52a00); border: 4px solid #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 4px #000; overflow: hidden; }
  #superBtn.cd { filter: grayscale(1) brightness(.6); }
  #superBtn .cdtxt { position: absolute; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #000; }
  #pauseBtn { position: absolute; top: 8px; right: 10px; width: 34px; height: 34px; background: rgba(0,0,0,.7); border: 2px solid #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }
  #banner { position: absolute; top: 40%; left: 0; right: 0; text-align: center; font-size: 30px; font-weight: 900; color: #ffd84a; text-shadow: 3px 3px 0 #000, 0 0 20px #f80; pointer-events: none; opacity: 0; transition: opacity .3s; }
  #banner.show { opacity: 1; }

  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.82); display: flex; flex-direction: column; align-items: center; padding: 16px; z-index: 40; overflow-y: auto; }
  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay h2 { text-align: center; flex-shrink: 0; }
  .opts { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; flex-shrink: 0; padding-bottom: 10px; }
  .opt { background: #1c1c30; border: 3px solid #3a3a5c; padding: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; box-shadow: 4px 4px 0 #000; flex-shrink: 0; }
  .opt:active { transform: translate(2px,2px); }
  .opt.atk { border-color: #e55; }
  .opt.def { border-color: #4af; }
  .opt.heal { border-color: #7CFC7C; }
  .opt .ico { font-size: 30px; width: 40px; text-align: center; }
  .opt .nm { font-size: 15px; font-weight: bold; color: #ffd84a; }
  .opt .ds { font-size: 11px; color: #c8c8e0; margin-top: 3px; line-height: 1.4; }
  .opt .tag { font-size: 10px; padding: 1px 5px; border: 1px solid; margin-left: 6px; }
  .result-box { background: #1c1c30; border: 4px solid #ffd84a; padding: 20px; width: 100%; max-width: 380px; box-shadow: 6px 6px 0 #000; text-align: center; }
  .result-box h2 { font-size: 30px; margin-bottom: 12px; }
  .result-box .line { font-size: 16px; padding: 4px 0; }
</style>
</head>
<body>
<div id="app">

  <div id="home">
    <div id="profileBar">
      <img id="pfAvatar" src="" alt="">
      <div><div class="nm" id="pfNick">-</div><div class="num" id="pfNum">-</div></div>
      <div class="tr" id="pfTr">🏆 0</div>
      <div id="syncDot" title="동기화"></div>
    </div>
    <div id="topbar">
      <div class="res">🪙 <b id="rCoin">0</b></div>
      <div class="res">💵 <b id="rWorm">0</b></div>
      <div class="res">🧩 <b id="rPuz">0</b></div>
    </div>
    <div id="tabcontent"></div>
    <div id="tabs">
      <div class="tab" data-tab="shop"><span class="ico">🏪</span>상점</div>
      <div class="tab" data-tab="squad"><span class="ico">👔</span>특공대</div>
      <div class="tab home-tab" data-tab="home"><span class="ico">🏠</span>홈</div>
      <div class="tab" data-tab="hunt"><span class="ico">🎯</span>사냥</div>
      <div class="tab" data-tab="settings"><span class="ico">⚙️</span>설정</div>
    </div>
  </div>

  <div id="battle" class="hidden">
    <canvas id="game"></canvas>
    <div id="hud">
      <div id="hpbar"><div id="hpfill"></div></div>
      <div id="gembar"><div id="gemfill"></div></div>
      <div id="hudtxt"><span id="hpTxt">HP</span><span id="killTxt">처치 0</span></div>
      <div id="pauseBtn">Ⅱ</div>
    </div>
    <div id="timer">00:00</div>
    <div id="skillrow"></div>
    <div id="banner"></div>
  </div>

  <div id="ovLevel" class="overlay hidden">
    <h2 id="ovLevelTitle">⬆️ 스킬 선택!</h2>
    <div class="opts" id="ovLevelOpts"></div>
  </div>
  <div id="ovPause" class="overlay hidden">
    <div class="result-box">
      <h2>⏸ 일시정지</h2>
      <div class="btn big blue" id="btnResume">계속하기</div>
      <div class="btn big gray" id="btnQuit" style="background:#666;color:#fff">포기하고 나가기</div>
    </div>
  </div>
  <div id="ovResult" class="overlay hidden">
    <div class="result-box">
      <h2 id="resTitle">승리!</h2>
      <div id="resLines"></div>
      <div class="btn big gold" id="btnResultOk">확인</div>
    </div>
  </div>
  <div id="toast" class="toast hidden"></div>

  <!-- 시작 화면 -->
  <div id="ovStart" class="overlay hidden">
    <div class="result-box" style="max-width:340px">
      <div class="pixel-title" style="font-size:30px">K-사냥맨</div>
      <p class="small" style="margin:6px 0 18px">서울을 지키는 K-직장인 👔</p>
      <div class="btn big" id="stNew" style="background:#3b8f3b">✨ 새 계정 만들기</div>
      <div class="btn big blue" id="stLogin" style="margin-top:10px">🔐 기존 계정 로그인</div>
    </div>
  </div>

  <!-- 가입 -->
  <div id="ovSignup" class="overlay hidden">
    <div class="result-box" style="max-width:360px;text-align:left">
      <h2 style="color:#7CFC7C;text-align:center">✨ 새 계정 만들기</h2>
      <label class="small">닉네임 (2~12자)</label>
      <input id="siNick" class="inp" placeholder="닉네임" maxlength="12">
      <label class="small">비밀번호 (4자 이상)</label>
      <div class="pwwrap"><input id="siPw" class="inp" type="password" placeholder="비밀번호" maxlength="32"><span class="eye" data-for="siPw">👁️</span></div>
      <label class="small">아바타 — 하나 골라 (또는 사진 올리기)</label>
      <div class="avgrid" id="siAvGrid"></div>
      <div class="row" style="margin-top:6px;align-items:center">
        <img id="siAvatarPreview" class="avprev" src="" alt="">
        <input type="file" id="siFile" accept="image/*" style="flex:1;font-size:12px;color:#ccc">
      </div>
      <div class="btn big" id="siGo" style="background:#3b8f3b;margin-top:14px">계정 만들기</div>
      <div class="btn" id="siBack" style="width:100%;background:#555;margin-top:8px;text-align:center">뒤로</div>
    </div>
  </div>

  <!-- 로그인 -->
  <div id="ovLogin" class="overlay hidden">
    <div class="result-box" style="max-width:340px;text-align:left">
      <h2 style="text-align:center">🔐 기존 계정 로그인</h2>
      <label class="small">닉네임</label>
      <input id="liNick" class="inp" placeholder="닉네임" maxlength="12">
      <label class="small">비밀번호</label>
      <div class="pwwrap"><input id="liPw" class="inp" type="password" placeholder="비밀번호" maxlength="32"><span class="eye" data-for="liPw">👁️</span></div>
      <div class="btn big blue" id="liGo" style="margin-top:14px">로그인</div>
      <div class="btn" id="liBack" style="width:100%;background:#555;margin-top:8px;text-align:center">뒤로</div>
    </div>
  </div>

  <!-- 계정 화면 -->
  <div id="ovAccount" class="overlay hidden">
    <div class="result-box" style="max-width:380px;text-align:left" id="acBox"></div>
  </div>

  <div id="ovLoading" class="overlay hidden">
    <div class="result-box">
      <h2 style="color:#4af">☁️ 로딩 중...</h2>
      <p class="small" id="loadTxt">계정을 불러오고 있어</p>
    </div>
  </div>
</div>

<script>
'use strict';
// =====================================================================
//  K-사냥맨  — K-직장인 서바이벌 (1챕터)
// =====================================================================

// ---------- 계정 (jsonbin.io) ----------
const BIN_MASTER_KEY = '$2a$10$NIj5ay0LyGnCMs/QyRVyQOQlYNMZ/lvyW7oRqmyjDSYgYX6bb.XH2';
const BIN_ID_KEY = 'k_sanyangman_binid_v1';
const SAVE_KEY = 'k_sanyangman_save_v3';
const DEFAULT_SAVE = {
  nick: '', num: 0, avatar: '', binId: '',
  coins: 0, worm: 0, puzzle: 0, upLv: 0, star: 0, lastHunt: Date.now(), bgm: true, sfx: true, clears: 0, best: 0,
  stats: { plays: 0, totalKills: 0, totalCoins: 0, totalPlayTime: 0, killByAttack: {} },
  achievements: [], created: 0, pw: '', updatedAt: 0, lastDaily: 0,
};
let S = Object.assign({}, DEFAULT_SAVE);

function loadLocal() { try { const raw = localStorage.getItem(SAVE_KEY); if (raw) S = Object.assign({}, DEFAULT_SAVE, JSON.parse(raw)); } catch (e) {} }
function saveLocal() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

async function apiCreate(data) {
  const r = await fetch('https://api.jsonbin.io/v3/b', {
    method: 'POST', headers: {'Content-Type': 'application/json', 'X-Master-Key': BIN_MASTER_KEY, 'X-Bin-Private': 'true'},
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error('create failed');
  const j = await r.json(); return j.metadata.id;
}
async function apiRead(id) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${id}/latest`, { headers: {'X-Master-Key': BIN_MASTER_KEY} });
  if (!r.ok) throw new Error('read failed');
  const j = await r.json(); return j.record;
}
async function apiUpdate(id, data) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${id}`, {
    method: 'PUT', headers: {'Content-Type': 'application/json', 'X-Master-Key': BIN_MASTER_KEY},
    body: JSON.stringify(data)
  });
  if (!r.ok) throw new Error('update failed');
}

let syncTimer = null, lastSyncData = '';
function setSyncStatus(s) { const d = document.getElementById('syncDot'); if (!d) return; d.classList.remove('pending', 'error'); if (s) d.classList.add(s); }
function save() {
  S.updatedAt = Date.now();
  saveLocal();
  if (!S.binId) return;
  clearTimeout(syncTimer); setSyncStatus('pending');
  syncTimer = setTimeout(async () => {
    try {
      const cur = JSON.stringify(S);
      if (cur === lastSyncData) { setSyncStatus(null); return; }
      await apiUpdate(S.binId, S); lastSyncData = cur; setSyncStatus(null);
    } catch (e) { setSyncStatus('error'); console.warn('sync failed', e); }
  }, 8000);
}

// ---------- 업적 ----------
const ACHIEVEMENTS = {
  firstWin:   { name: '첫 승리', title: '루키',           desc: '1챕터 첫 클리어',                 check: () => S.clears >= 1 },
  veteran:    { name: '베테랑', title: '베테랑',           desc: '10회 클리어',                     check: () => S.clears >= 10 },
  speedrun:   { name: '스피드러너', title: '칼퇴러',       desc: '12분 안에 클리어',                check: (ctx) => ctx && ctx.finishTime && ctx.finishTime <= 12*60 },
  perfect:    { name: '완벽주의자', title: '무결점 사원',  desc: '체력 100%로 클리어',              check: (ctx) => ctx && ctx.finishHpRatio && ctx.finishHpRatio >= 1.0 },
  rich:       { name: '부자', title: '재벌',               desc: '코인 10,000 모으기',              check: () => S.coins >= 10000 },
  superColl:  { name: '슈퍼 컬렉터', title: '만능 대리',   desc: '한 판에 슈퍼 스킬 3개 이상 만들기', check: (ctx) => ctx && ctx.supersCount && ctx.supersCount >= 3 },
  slaughter:  { name: '학살자', title: '몰살자',           desc: '한 판에 500킬',                   check: (ctx) => ctx && ctx.runKills >= 500 },
  starMax:    { name: '별 최대', title: '임원',             desc: 'K-직장인 ★6 달성',                 check: () => S.star >= 6 },
  sniper:     { name: '명사수', title: '저격수',           desc: '사표 던지기로 누적 100킬',        check: () => (S.stats.killByAttack.resign || 0) >= 100 },
  workaholic: { name: '지구력', title: '야근왕',           desc: '총 플레이 10시간',                check: () => S.stats.totalPlayTime >= 10*3600 },
};
function checkAchievements(ctx) {
  const gained = [];
  for (const k in ACHIEVEMENTS) if (!S.achievements.includes(k) && ACHIEVEMENTS[k].check(ctx)) { S.achievements.push(k); gained.push(k); }
  if (gained.length) { save(); gained.forEach((k, i) => setTimeout(() => toast('🏆 업적: ' + ACHIEVEMENTS[k].name), i * 1500)); }
}

// ---------------- 데이터 ----------------
const STAR_COST = [30, 50, 70, 100, 120, 150];
const STAR_DESC = [
  '야근 근성 — 치명타 확률 +15%',
  '아메리카노 원샷 — 공격/체력 대폭 상승',
  '커피 파워 — 모든 쿨타임 -15%',
  '승진 각오 — 공격/체력 대폭 상승',
  '임원 오라 — 공격/체력 대폭 상승',
  '월급날 각성 — 잃은 체력%만큼 공격력 +최대 50%',

function fmt(n) { return n.toLocaleString('ko-KR'); }
function fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 1800); }

function drawSprite(ctx, spr, x, y, scale, flip) {
  const rows = spr.rows, h = rows.length, w = rows[0].length;
  const ox = x - (w * scale) / 2, oy = y - (h * scale) / 2;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = rows[r][c]; if (ch === '.') continue;
    const col = spr.pal[ch]; if (!col) continue;
    ctx.fillStyle = col;
    const cx = flip ? (w - 1 - c) : c;
    ctx.fillRect(Math.round(ox + cx * scale), Math.round(oy + r * scale), Math.ceil(scale), Math.ceil(scale));
  }
}

function heroStats() {
  let atk = 14 + S.upLv * 2, hp = 200 + S.upLv * 25;
  if (S.star >= 2) { atk *= 1.3; hp *= 1.3; }
  if (S.star >= 4) { atk *= 1.3; hp *= 1.3; }
  if (S.star >= 5) { atk *= 1.2; hp *= 1.2; }
  return { atk: Math.round(atk), hp: Math.round(hp) };
}
function starCritBonus() { return S.star >= 1 ? 0.15 : 0; }
function starCdMul() { return S.star >= 3 ? 0.85 : 1; }
function starPayrollAtkMul(p) { if (S.star < 6) return 1; const lost = 1 - p.hp / p.maxHp; return 1 + Math.min(0.5, lost * 0.5); }
function upgradeCost() { return 100 + S.upLv * 50; }

const audio = {
  ctx: null, bgmOn: false, nextNote: 0, step: 0, timer: null, gain: null,
  melody: [392, 392, 440, 392, 523, 494, 0, 392, 392, 440, 392, 587, 523, 0, 392, 392, 784, 659, 523, 494, 440, 0, 698, 698, 659, 523, 587, 523, 0, 0],
  bass:   [196, 0, 196, 0, 262, 0, 262, 0, 196, 0, 196, 0, 294, 0, 294, 0, 196, 0, 196, 0, 330, 0, 330, 0, 175, 0, 175, 0, 196, 0],
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.gain = this.ctx.createGain(); this.gain.gain.value = .12; this.gain.connect(this.ctx.destination); } catch (e) {} },
  tone(freq, t, dur, type, vol) { if (!this.ctx || !freq) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + dur + .02); },
  startBgm() { this.init(); if (!this.ctx) return; if (this.ctx.state === 'suspended') this.ctx.resume().catch(()=>{}); this.bgmOn = true; this.nextNote = this.ctx.currentTime + .05; this.step = 0; clearInterval(this.timer); this.timer = setInterval(() => this.schedule(), 60); },
  stopBgm() { this.bgmOn = false; clearInterval(this.timer); },
  updateBgm() { if (this.ctx) this.ctx.resume && this.ctx.resume(); },
  schedule() {
    if (!this.bgmOn || !S.bgm || !this.ctx) return;
    const stepDur = 0.16;
    while (this.nextNote < this.ctx.currentTime + 0.2) {
      const i = this.step % this.melody.length;
      this.tone(this.melody[i], this.nextNote, stepDur * .9, 'square', .5);
      this.tone(this.bass[i], this.nextNote, stepDur * .8, 'triangle', .7);
      this.nextNote += stepDur; this.step++;
    }
  },
  stressSfx() {
    if (!S.sfx) return; this.init(); if (!this.ctx) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 5; i++) { this.tone(220 - i * 20, t + i * .18, .12, 'sawtooth', 1.2); this.tone(880 + i * 60, t + i * .18, .06, 'square', .6); }
    this.tone(110, t + 1.0, .5, 'sawtooth', 1.5);
  },
};

function optionPool() {
  const pool = [];
  const nAtk = Object.keys(run.skills).filter(k => k !== 'stress').length;
  const nDef = Object.keys(run.defs).length;
  for (const k in ATTACKS) {
    if (k === 'stress') continue;
    if (run.skills[k]) { if (!run.sup[k] && run.skills[k] < 5) pool.push({ type: 'atk', key: k }); }
    else if (nAtk < MAX_ATK) pool.push({ type: 'atk', key: k });
  }

function update(dt) {

  const k = run.keys; if (k['arrowleft'] || k['a']) mx -= 1; if (k['arrowright'] || k['d']) mx += 1; if (k['arrowup'] || k['w']) my -= 1; if (k['arrowdown'] || k['s']) my += 1;

    if (run.t >= RUN_LEN) spawnBoss();
  }

  // 자동 공격 발동
  for (const k in run.skills) {
    if (k === 'stress') continue;

    if (run.timers[k] <= 0) FIRE[k] && FIRE[k](run.skills[k]);

      pr.x += pr.vx * dt; pr.y += pr.vy * dt;
      for (const e of run.enemies) if (!e.dead && !pr.hit.has(e) && dist(pr, e) < e.size * .6 + 8) { pr.hit.add(e); hitEnemy(e, pr.dmg, 'card', pr.col); if (pr.explodes) { run.fx.push({ ring: true, x: pr.x, y: pr.y, r: 40, t: 0.2, col: '#fff' }); for (const e2 of run.enemies) if (!e2.dead && e2 !== e && dist(pr, e2) < 40) hitEnemy(e2, pr.dmg * 0.4, 'card', '#fff'); } pr.pierce--; if (pr.pierce <= 0) { pr.t = -1; break; } }

function updateMiniBoss(m, dt) {

function updateBoss(b, dt) {

// ---------- 그리기 ----------
function draw() {
  const p = run.p, camX = p.x - W / 2, camY = p.y - H / 2;

    const gx = Math.floor((x + camX) / tile), gy = Math.floor((y + camY) / tile);
    const shade = ((gx * 31 + gy * 17) % 5);
    const base = 42 + shade * 4;

  for (let y = sy; y < H; y += tile) { ctx.beginPath(); ctx.moveTo(0, y - 1); ctx.lineTo(W, y - 1); ctx.stroke(); }

  // === 승강장 장식 ===
  for (let gx = Math.floor(camX / 260) - 1; gx <= Math.floor((camX + W) / 260) + 1; gx++) for (let gy = Math.floor(camY / 260) - 1; gy <= Math.floor((camY + H) / 260) + 1; gy++) {
    const seed = Math.abs((gx * 73856093) ^ (gy * 19349663));
    const kind = seed % 12;
    const x = gx * 260 + (seed * 41 % 200) - camX, y = gy * 260 + (seed * 67 % 180) - camY;

    if (kind === 0) { // === 지하철 벤치 (스테인리스) ===
      ctx.fillStyle = '#8a95a3'; ctx.fillRect(x, y + 22, 78, 8);           // 좌석
      ctx.fillStyle = '#5a6570'; ctx.fillRect(x, y + 30, 78, 3);
      ctx.fillStyle = '#3a4550'; ctx.fillRect(x + 6, y + 33, 4, 14); ctx.fillRect(x + 68, y + 33, 4, 14);  // 다리
      ctx.fillStyle = '#8a95a3'; ctx.fillRect(x, y + 12, 78, 10);         // 등받이
      ctx.fillStyle = '#5a6570'; ctx.fillRect(x, y + 20, 78, 2);
      ctx.fillStyle = '#333'; ctx.fillRect(x, y + 47, 78, 3);            // 그림자
    }

      ctx.fillStyle = '#000'; for (let i = 2; i < 180; i += 8) for (let j = 2; j < 10; j += 4) ctx.fillRect(x + i, y + j, 2, 2);
      ctx.fillStyle = '#8a6a10'; ctx.fillRect(x, y + 10, 180, 1);
    }
    else if (kind === 2) { // === 출구 안내판 (초록 유도등) ===
      ctx.fillStyle = '#111'; ctx.fillRect(x - 2, y - 2, 62, 40);
      ctx.fillStyle = '#0a5a2a'; ctx.fillRect(x, y, 58, 36);
      ctx.fillStyle = '#0fa050'; ctx.fillRect(x + 2, y + 2, 54, 32);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 15px sans-serif'; ctx.textAlign = 'left';
      ctx.fillText('출구', x + 6, y + 18);
      // 화살표
      ctx.fillStyle = '#fff';
      ctx.fillRect(x + 10, y + 25, 34, 3);
      ctx.beginPath(); ctx.moveTo(x + 50, y + 26.5); ctx.lineTo(x + 44, y + 22); ctx.lineTo(x + 44, y + 31); ctx.closePath(); ctx.fill();
      // 지지대
      ctx.fillStyle = '#555'; ctx.fillRect(x + 26, y + 36, 6, 30);
    }
    else if (kind === 3) { // === 대리석 기둥 (2단) ===
      ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 34, 90);         // 그림자
      ctx.fillStyle = '#c8c8d0'; ctx.fillRect(x, y, 34, 90);              // 몸체 밝은 대리석
      ctx.fillStyle = '#8a8a95'; ctx.fillRect(x + 28, y, 6, 90);          // 오른쪽 그라디언트
      ctx.fillStyle = '#e8e8f0'; ctx.fillRect(x, y, 4, 90);               // 왼쪽 하이라이트
      ctx.fillStyle = '#5a5a68'; ctx.fillRect(x - 2, y - 4, 38, 6);       // 상단 캡
      ctx.fillStyle = '#5a5a68'; ctx.fillRect(x - 2, y + 88, 38, 6);      // 하단 캡
      // 대리석 무늬
      ctx.strokeStyle = 'rgba(90,90,110,.4)'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x + 4, y + 20); ctx.lineTo(x + 30, y + 30); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(x + 8, y + 55); ctx.lineTo(x + 28, y + 70); ctx.stroke();
    }
    else if (kind === 4) { // === 광고 포스터 (액자) ===
      ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, 56, 84);         // 액자
      ctx.fillStyle = '#e0d020'; ctx.fillRect(x, y, 52, 80);              // 배경 노랑
      // 인물 그림자
      ctx.fillStyle = '#111'; ctx.fillRect(x + 10, y + 10, 32, 30);
      // 얼굴
      ctx.fillStyle = '#f4c290'; ctx.fillRect(x + 14, y + 14, 24, 22);
      ctx.fillStyle = '#000'; ctx.fillRect(x + 18, y + 22, 3, 3); ctx.fillRect(x + 31, y + 22, 3, 3);  // 눈
      // 로고 바
      ctx.fillStyle = '#c22'; ctx.fillRect(x, y + 46, 52, 20);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('신차 출시', x + 26, y + 60);
      ctx.fillStyle = '#000'; ctx.fillRect(x, y + 66, 52, 14);
      ctx.fillStyle = '#ffd84a'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('HYUNDAI', x + 26, y + 76);
      ctx.textAlign = 'left';
    }
    else if (kind === 5) { // === 쓰레기통 (분리수거) ===
      ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 30, 34);         // 그림자
      ctx.fillStyle = '#4a5560'; ctx.fillRect(x, y + 4, 30, 32);          // 몸체
      ctx.fillStyle = '#5a6570'; ctx.fillRect(x, y + 4, 30, 4);
      ctx.fillStyle = '#2a3540'; ctx.fillRect(x, y, 30, 6);               // 뚜껑
      ctx.fillStyle = '#7CFC7C'; ctx.fillRect(x + 3, y + 14, 10, 12);     // 재활용 (초록)
      ctx.fillStyle = '#4af'; ctx.fillRect(x + 17, y + 14, 10, 12);       // 일반 (파랑)
      ctx.fillStyle = '#000'; ctx.font = 'bold 6px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('재활용', x + 8, y + 22); ctx.fillText('일반', x + 22, y + 22);
      ctx.textAlign = 'left';
    }
    else if (kind === 6) { // === 천장 파이프 배선 ===
      ctx.fillStyle = '#4a4a55'; ctx.fillRect(x, y, 120, 10);
      ctx.fillStyle = '#7a7a85'; ctx.fillRect(x, y + 1, 120, 2);
      ctx.fillStyle = '#2a2a35'; ctx.fillRect(x, y + 10, 120, 2);
      ctx.fillStyle = '#c22'; ctx.fillRect(x + 30, y + 3, 4, 4);          // 밸브
      ctx.fillStyle = '#e0e020'; ctx.fillRect(x + 80, y + 3, 4, 4);
      ctx.fillStyle = '#2a2a30'; ctx.fillRect(x + 20, y + 12, 6, 3); ctx.fillRect(x + 60, y + 12, 6, 3); ctx.fillRect(x + 100, y + 12, 6, 3);
    }
    else if (kind === 7) { // === 노선도 안내판 ===
      ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, 96, 26);
      ctx.fillStyle = '#f8f8f0'; ctx.fillRect(x, y, 92, 22);
      ctx.fillStyle = '#0f6b3a'; ctx.beginPath(); ctx.arc(x + 14, y + 11, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('2', x + 14, y + 15); ctx.textAlign = 'left';
      ctx.fillStyle = '#222'; ctx.font = 'bold 12px sans-serif';
      ctx.fillText('강남', x + 26, y + 15);
      // 선로 표시
      ctx.fillStyle = '#0f6b3a'; ctx.fillRect(x + 58, y + 10, 30, 3);
      ctx.fillStyle = '#222'; ctx.fillRect(x + 62, y + 8, 2, 7); ctx.fillRect(x + 76, y + 8, 2, 7);
      ctx.fillStyle = '#666'; ctx.fillRect(x + 44, y + 22, 6, 24);        // 지지대
    }
    else if (kind === 8) { // === 자판기 ===
      ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 46, 74);
      ctx.fillStyle = '#c22'; ctx.fillRect(x, y, 46, 74);
      ctx.fillStyle = '#8a1010'; ctx.fillRect(x, y + 68, 46, 6);
      // 상단 로고 밴드
      ctx.fillStyle = '#fff'; ctx.fillRect(x + 4, y + 4, 38, 10);
      ctx.fillStyle = '#c22'; ctx.font = 'bold 9px sans-serif'; ctx.fillText('COLA', x + 12, y + 12);
      // 유리창
      ctx.fillStyle = '#87ceeb'; ctx.fillRect(x + 4, y + 18, 30, 32);
      // 음료 캔들
      for (let r = 0; r < 3; r++) for (let cc = 0; cc < 3; cc++) {
        ctx.fillStyle = ['#e33', '#3a7', '#eb3'][cc]; ctx.fillRect(x + 6 + cc * 10, y + 20 + r * 10, 8, 8);
        ctx.fillStyle = '#fff'; ctx.fillRect(x + 8 + cc * 10, y + 22 + r * 10, 4, 2);
      }
      // 버튼 패널
      ctx.fillStyle = '#222'; ctx.fillRect(x + 36, y + 18, 8, 32);
      for (let i = 0; i < 4; i++) { ctx.fillStyle = '#4af'; ctx.fillRect(x + 38, y + 20 + i * 7, 4, 4); }
      // 컵 배출구
      ctx.fillStyle = '#111'; ctx.fillRect(x + 6, y + 54, 34, 12);
    }
    else if (kind === 9) { // === 승강장 열차 도착 전광판 (LED) ===
      ctx.fillStyle = '#000'; ctx.fillRect(x - 2, y - 2, 156, 34);
      ctx.fillStyle = '#0a0a12'; ctx.fillRect(x, y, 152, 30);
      // LED 도트
      ctx.fillStyle = '#f80';
      const msg = '다음 열차 3분 후';
      ctx.font = 'bold 13px monospace';
      ctx.fillText(msg, x + 6, y + 12);
      ctx.fillStyle = '#ff0';
      ctx.font = 'bold 11px monospace';
      ctx.fillText('▶ 강남 방면', x + 6, y + 26);
      // 지지대
      ctx.fillStyle = '#444'; ctx.fillRect(x + 74, y + 30, 6, 20);
    }
    else if (kind === 10) { // === 지하철 노선 색 띠 (벽면 트림) ===
      ctx.fillStyle = '#0f6b3a'; ctx.fillRect(x, y, 200, 4);
      ctx.fillStyle = '#0d5a30'; ctx.fillRect(x, y + 4, 200, 1);
      // 라인 번호 원
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x + 100, y + 2, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f6b3a'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('2', x + 100, y + 5); ctx.textAlign = 'left';
    }
    else if (kind === 11) { // === 신문 가판대 ===
      ctx.fillStyle = '#000'; ctx.fillRect(x + 2, y + 2, 52, 38);
      ctx.fillStyle = '#5a3a2a'; ctx.fillRect(x, y, 52, 38);
      ctx.fillStyle = '#7a5a4a'; ctx.fillRect(x, y, 52, 4);
      // 신문 3부
      ctx.fillStyle = '#f5f0e0'; ctx.fillRect(x + 4, y + 8, 14, 20);
      ctx.fillStyle = '#f5f0e0'; ctx.fillRect(x + 20, y + 8, 14, 20);
      ctx.fillStyle = '#f5f0e0'; ctx.fillRect(x + 36, y + 8, 14, 20);
      ctx.fillStyle = '#000';
      ctx.fillRect(x + 5, y + 9, 12, 2); ctx.fillRect(x + 21, y + 9, 12, 2); ctx.fillRect(x + 37, y + 9, 12, 2);
      for (let r = 0; r < 4; r++) { ctx.fillRect(x + 5, y + 13 + r * 3, 8, 1); ctx.fillRect(x + 21, y + 13 + r * 3, 8, 1); ctx.fillRect(x + 37, y + 13 + r * 3, 8, 1); }
    }
  }
  // 아레나
  if (run.arena) { const a = run.arena; ctx.save(); ctx.strokeStyle = '#f33'; ctx.lineWidth = 4; ctx.setLineDash([12, 8]); ctx.beginPath(); ctx.arc(a.x - camX, a.y - camY, a.r, 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  // 독 웅덩이
  for (const pd of run.puddles) { const warn = pd.t > pd.life; ctx.fillStyle = warn ? 'rgba(160,255,60,.25)' : 'rgba(120,220,40,.55)'; ctx.beginPath(); ctx.arc(pd.x - camX, pd.y - camY, pd.r, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = '#8f4'; ctx.lineWidth = 2; ctx.stroke(); }
  // 존
  for (const z of run.zones) { ctx.save(); ctx.globalAlpha = 0.35 + 0.15 * Math.sin(run.t * 8); ctx.fillStyle = z.col; ctx.beginPath(); ctx.arc(z.x - camX, z.y - camY, z.r, 0, Math.PI * 2); ctx.fill(); ctx.strokeStyle = z.col; ctx.lineWidth = 2; ctx.globalAlpha = 0.9; ctx.stroke(); ctx.restore(); }
  // 보석
  for (const g of run.gemList) { const x = g.x - camX, y = g.y - camY; ctx.fillStyle = g.gold ? '#ffd84a' : '#4af'; ctx.beginPath(); ctx.moveTo(x, y - 6); ctx.lineTo(x + 5, y); ctx.lineTo(x, y + 6); ctx.lineTo(x - 5, y); ctx.closePath(); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 3, 2, 2); }
  // 보스 조준선
  if (run.boss && run.boss.state === 'aim') { const b = run.boss; ctx.save(); ctx.strokeStyle = 'rgba(255,60,60,.8)'; ctx.lineWidth = b.size; ctx.setLineDash([10, 10]); ctx.beginPath(); ctx.moveTo(b.x - camX, b.y - camY); ctx.lineTo(b.x - camX + b.chargeDir.x * b.chargeDist, b.y - camY + b.chargeDir.y * b.chargeDist); ctx.stroke(); ctx.restore(); }
  // 적
  for (const e of run.enemies) {
    const x = e.x - camX, y = e.y - camY; if (x < -60 || x > W + 60 || y < -60 || y > H + 60) continue;
    const spr = SPR[e.type]; const scale = e.boss ? 4 : (e.miniBoss ? 3.5 : (e.strong ? 2.6 : 2.2));
    const flip = e.x > p.x;
    if (e.hitT > 0) { ctx.save(); ctx.filter = 'brightness(3)'; drawSprite(ctx, spr, x, y + (e.erratic ? Math.sin(e.wob * 3) * 3 : 0), scale, flip); ctx.restore(); }
    else drawSprite(ctx, spr, x, y + (e.erratic ? Math.sin(e.wob * 3) * 3 : 0), scale, flip);
    if (e.stunT > 0) { ctx.fillStyle = '#ff0'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('⚡', x, y - e.size - 5); }
    if (e.miniBoss || e.boss) {
      const w = e.boss ? 140 : 80, hh = e.boss ? 10 : 7;
      ctx.fillStyle = '#000'; ctx.fillRect(x - w / 2, y - e.size - 14, w, hh);
      ctx.fillStyle = e.boss ? '#f33' : '#fa3'; ctx.fillRect(x - w / 2, y - e.size - 14, w * Math.max(0, e.hp / e.maxHp), hh);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(ENEMIES[e.type].name + (e.boss ? ' (P' + e.phase + ')' : ''), x, y - e.size - 18);
      ctx.textAlign = 'left';
    }
  }
  // 투사체
  for (const pr of run.projs) {
    const x = pr.x - camX, y = pr.y - camY;
    ctx.save();
    if (pr.kind === 'boomer') { ctx.translate(x, y); ctx.rotate(pr.rot); ctx.fillStyle = pr.col; ctx.fillRect(-8, -3, 16, 6); ctx.fillStyle = '#a83'; ctx.fillRect(-2, -2, 4, 4); }
    else if (pr.kind === 'usb') { ctx.translate(x, y); ctx.rotate(Math.atan2(pr.vy, pr.vx)); ctx.fillStyle = pr.col; ctx.fillRect(-6, -3, 12, 6); ctx.fillStyle = '#fff'; ctx.fillRect(4, -2, 3, 4); }
    else if (pr.kind === 'pen') { ctx.translate(x, y); ctx.rotate(Math.atan2(pr.vy, pr.vx)); ctx.fillStyle = pr.col; ctx.fillRect(-8, -1, 16, 2); ctx.fillStyle = '#fff'; ctx.fillRect(6, -1, 4, 2); }
    else if (pr.kind === 'card') { ctx.translate(x, y); ctx.rotate(Math.atan2(pr.vy, pr.vx)); ctx.fillStyle = '#fff'; ctx.fillRect(-8, -5, 16, 10); ctx.fillStyle = '#000'; ctx.fillRect(-6, -3, 8, 2); ctx.fillRect(-6, 0, 5, 2); }
    else if (pr.kind === 'resign') { ctx.translate(x, y); ctx.rotate(run.t * 8); ctx.fillStyle = '#fff'; ctx.fillRect(-10, -14, 20, 28); ctx.fillStyle = '#f80'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('사표', 0, 2); }
    ctx.restore();
  }
  // 적 발사체
  for (const pr of run.eProjs) {
    const x = pr.x - camX, y = pr.y - camY;
    if (pr.paper) { ctx.save(); ctx.translate(x, y); ctx.rotate(run.t * 6); ctx.fillStyle = pr.col; ctx.fillRect(-8, -10, 16, 20); ctx.fillStyle = '#000'; ctx.fillRect(-6, -6, 12, 1); ctx.fillRect(-6, -3, 8, 1); ctx.fillRect(-6, 0, 10, 1); ctx.restore(); }
    else { ctx.fillStyle = pr.col; ctx.beginPath(); ctx.arc(x, y, pr.r, 0, Math.PI * 2); ctx.fill(); ctx.fillStyle = '#fff'; ctx.fillRect(x - 1, y - 1, 2, 2); }
  }
  // 보스 레이저
  if (run.boss && run.boss.state === 'laser') {
    const b = run.boss;
    ctx.save(); ctx.strokeStyle = 'rgba(255,50,50,.85)'; ctx.lineWidth = 8; ctx.beginPath();
    ctx.moveTo(b.x - camX, b.y - camY);
    ctx.lineTo(b.x - camX + Math.cos(b.laserA) * 1200, b.y - camY + Math.sin(b.laserA) * 1200);
    ctx.stroke();
    ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.stroke();
    ctx.restore();
  }
  // 이펙트
  for (const f of run.fx) {
    if (f.arc) { ctx.save(); ctx.globalAlpha = f.t / .2; ctx.fillStyle = f.col; ctx.beginPath(); ctx.moveTo(f.x - camX, f.y - camY); ctx.arc(f.x - camX, f.y - camY, f.r, f.a - f.half, f.a + f.half); ctx.closePath(); ctx.fill(); ctx.restore(); }
    else if (f.ring) { ctx.save(); ctx.globalAlpha = f.t / .3; ctx.strokeStyle = f.col; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(f.x - camX, f.y - camY, f.r * (1 - f.t / .3 * .3), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
    else if (f.bolt) { ctx.save(); ctx.globalAlpha = f.t / .25; ctx.strokeStyle = f.col; ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(f.x1 - camX, f.y1 - camY); const mx = (f.x1 + f.x2) / 2 + rnd(-10, 10), my = (f.y1 + f.y2) / 2 + rnd(-10, 10); ctx.lineTo(mx - camX, my - camY); ctx.lineTo(f.x2 - camX, f.y2 - camY); ctx.stroke(); ctx.restore(); }
    else { ctx.fillStyle = f.col; ctx.fillRect(f.x - camX - f.r / 2, f.y - camY - f.r / 2, f.r, f.r); }
  }
  // 플레이어
  const px = W / 2, py = H / 2;
  if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0) ctx.globalAlpha = .4;
  drawSprite(ctx, SPR.worker, px, py, 2.5, p.facing < 0);
  ctx.globalAlpha = 1;
  if (run.stressActive > 0) { ctx.save(); ctx.strokeStyle = '#f80'; ctx.lineWidth = 3; ctx.globalAlpha = .6; ctx.beginPath(); ctx.arc(px, py, 140 * rangeMul(), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  // 텍스트
  ctx.textAlign = 'center';
  for (const t of run.texts) { ctx.globalAlpha = clamp(t.t / .3, 0, 1); ctx.font = (t.big ? 'bold 18px' : 'bold 13px') + ' sans-serif'; ctx.fillStyle = '#000'; ctx.fillText(t.txt, t.x - camX + 1, t.y - camY + 1); ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x - camX, t.y - camY); }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  // 조이스틱
  if (run.input.active) { ctx.save(); ctx.globalAlpha = .35; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(run.input.sx, run.input.sy, 40, 0, Math.PI * 2); ctx.stroke(); const dx = run.input.cx - run.input.sx, dy = run.input.cy - run.input.sy, l = Math.hypot(dx, dy) || 1, cl = Math.min(l, 40); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(run.input.sx + dx / l * cl, run.input.sy + dy / l * cl, 16, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }

  // HUD
  $('#hpfill').style.width = (p.hp / p.maxHp * 100) + '%';
  $('#gemfill').style.width = (run.gems / run.gemNeed * 100) + '%';
  $('#hpTxt').textContent = `❤️ ${Math.ceil(p.hp)} / ${p.maxHp}`;
  $('#killTxt').textContent = `👾 처치 ${run.kills}  💎 ${run.gems.toFixed(0)}/${run.gemNeed}`;
  $('#timer').textContent = run.phase === 'boss' ? 'BOSS' : (fmtTime(RUN_LEN - run.t) + '  (' + Math.floor(run.t/60) + '분 경과)');
}

function loop(now) {
  if (!run) return;
  raf = requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000; lastT = now; if (dt > .05) dt = .05;
  if (!run.paused && !run.over) update(dt);
  if (run) draw();
}

const BIN_PREFIX = 'KSM|';
async function boot() {
  loadLocal();
  const binId = localStorage.getItem(BIN_ID_KEY);
  if (!binId) { showOv('ovStart'); return; }
  showOv('ovLoading'); $('#loadTxt').textContent = '계정을 불러오고 있어';
  try {
    const data = await apiRead(binId);
    // 로컬이 더 최신이면 로컬 우선 (동기화 전에 닫은 경우 대비)
    if (S.binId === binId && (S.updatedAt || 0) > (data.updatedAt || 0)) { save(); }
    else { S = Object.assign({}, DEFAULT_SAVE, data, { binId }); lastSyncData = JSON.stringify(S); saveLocal(); }
  } catch (e) { toast('☁️ 서버 연결 실패, 로컬 데이터로 진행'); }
  hideOv('ovLoading'); updateProfileBar(); showTab('home');
}
function showOv(id) { document.querySelectorAll('.overlay').forEach(o => { if (['ovLevel','ovPause','ovResult'].includes(o.id)) return; o.classList.add('hidden'); }); $('#' + id).classList.remove('hidden'); }

const _avCache = {};
function emojiAvatar(emo) {
  if (_avCache[emo]) return _avCache[emo];
  const c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
  const bg = ['#2a4a80', '#3b8f3b', '#8a3060', '#b58a1c', '#2f6fd9', '#5a3a1a', '#3a6a3a', '#a33'][PRESET_AVATARS.indexOf(emo) % 8] || '#345';
  x.fillStyle = bg; x.fillRect(0, 0, 128, 128);
  x.font = '80px "Apple Color Emoji", "Segoe UI Emoji", "Noto Color Emoji", "Twemoji Mozilla", sans-serif';
  x.textBaseline = 'middle';
  x.textAlign = 'left';
  const m = x.measureText(emo);
  x.fillText(emo, Math.round(64 - m.width / 2), 68);
  return _avCache[emo] = c.toDataURL('image/png');
}
function resizeImg(file, size) {
  return new Promise((res, rej) => {
    const rd = new FileReader(); rd.onerror = rej;
    rd.onload = e => { const img = new Image(); img.onload = () => { const c = document.createElement('canvas'); c.width = c.height = size; const x = c.getContext('2d'); const sq = Math.min(img.width, img.height); x.drawImage(img, (img.width - sq) / 2, (img.height - sq) / 2, sq, sq, 0, 0, size, size); res(c.toDataURL('image/jpeg', 0.82)); }; img.onerror = rej; img.src = e.target.result; };
    rd.readAsDataURL(file);
  });
}
function buildAvGrid(gridEl, previewEl, onPick) {
  gridEl.innerHTML = '';
  PRESET_AVATARS.forEach(emo => { const im = document.createElement('img'); im.src = emojiAvatar(emo); im.addEventListener('click', () => { gridEl.querySelectorAll('img').forEach(i => i.classList.remove('sel')); im.classList.add('sel'); previewEl.src = im.src; onPick(im.src); }); gridEl.appendChild(im); });
  gridEl.firstChild.classList.add('sel'); previewEl.src = emojiAvatar(PRESET_AVATARS[0]); onPick(previewEl.src);
}
function wireFile(inputEl, gridEl, previewEl, onPick) {
  inputEl.addEventListener('change', async e => { const f = e.target.files[0]; if (!f) return; if (f.size > 8 * 1024 * 1024) return toast('파일이 너무 커! 8MB 이하로'); try { const d = await resizeImg(f, 128); gridEl.querySelectorAll('img').forEach(i => i.classList.remove('sel')); previewEl.src = d; onPick(d); } catch (err) { toast('이미지 오류'); } });
}
// 눈 아이콘 토글 (동적 요소 포함)
document.addEventListener('click', e => { const t = e.target.closest('.eye'); if (!t) return; const inp = document.getElementById(t.dataset.for); if (!inp) return; const show = inp.type === 'password'; inp.type = show ? 'text' : 'password'; t.classList.toggle('off', show); });

// ---------- 비밀번호 해시 ----------
async function hashPw(pw) {
  const str = 'ksm-salt|' + pw;
  try { const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str)); return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join(''); }
  catch (e) { let h = 5381; for (let i = 0; i < str.length; i++) h = ((h << 5) + h + str.charCodeAt(i)) >>> 0; return 'fb' + h.toString(16); }
}

// ---------- jsonbin 추가 API ----------
async function apiCreateNamed(data, name) {
  const r = await fetch('https://api.jsonbin.io/v3/b', { method: 'POST', headers: { 'Content-Type': 'application/json', 'X-Master-Key': BIN_MASTER_KEY, 'X-Bin-Private': 'true', 'X-Bin-Name': encodeURIComponent(name).slice(0, 120) }, body: JSON.stringify(data) });
  if (!r.ok) throw new Error('create failed ' + r.status);
  const j = await r.json(); return j.metadata.id;
}
async function apiRename(id, name) {
  const r = await fetch(`https://api.jsonbin.io/v3/b/${id}/meta/name`, { method: 'PUT', headers: { 'X-Master-Key': BIN_MASTER_KEY, 'X-Bin-Name': encodeURIComponent(name).slice(0, 120) } });
  if (!r.ok) throw new Error('rename failed ' + r.status);
}
async function apiListPage(lastId) {
  const url = 'https://api.jsonbin.io/v3/c/uncategorized/bins' + (lastId ? '/' + lastId : '');
  const r = await fetch(url, { headers: { 'X-Master-Key': BIN_MASTER_KEY } });
  if (!r.ok) throw new Error('list failed ' + r.status);
  const j = await r.json(); return Array.isArray(j) ? j : (j.record || j.bins || []);
}
async function findBinsByName(name) {
  const found = []; let last = null;
  for (let page = 0; page < 30; page++) {
    const rows = await apiListPage(last);
    if (!rows.length) break;
    for (const row of rows) { const nm = (row.snippetMeta && row.snippetMeta.name) || row.name || ''; const id = row.record || row.id || row.binId; let dec = nm; try { dec = decodeURIComponent(nm); } catch(e) {} if ((nm === name || dec === name) && id) found.push(id); }
    const lastRow = rows[rows.length - 1]; last = lastRow.record || lastRow.id || lastRow.binId;
    if (rows.length < 10 || !last) break;
  }
  return found;
}

// ---------- 시작 / 가입 / 로그인 ----------
$('#stNew').addEventListener('click', () => { showOv('ovSignup'); siAvatarData = ''; buildAvGrid($('#siAvGrid'), $('#siAvatarPreview'), d => siAvatarData = d); });
$('#stLogin').addEventListener('click', () => showOv('ovLogin'));
$('#siBack').addEventListener('click', () => showOv('ovStart'));
$('#liBack').addEventListener('click', () => showOv('ovStart'));

let siAvatarData = '';
wireFile($('#siFile'), $('#siAvGrid'), $('#siAvatarPreview'), d => siAvatarData = d);

function busy(btn, txt) { btn.dataset.orig = btn.dataset.orig || btn.textContent; btn.textContent = txt; btn.classList.add('disabled'); }
function unbusy(btn) { btn.textContent = btn.dataset.orig || btn.textContent; btn.classList.remove('disabled'); }
function enterAccount(data, binId, msg) {
  S = Object.assign({}, DEFAULT_SAVE, data, { binId }); lastSyncData = JSON.stringify(S); saveLocal();
  localStorage.setItem(BIN_ID_KEY, binId);
  document.querySelectorAll('.overlay').forEach(o => o.classList.add('hidden'));
  updateProfileBar(); showTab('home'); if (msg) toast(msg);
}

$('#siGo').addEventListener('click', async () => {
  const nick = $('#siNick').value.trim(), pw = $('#siPw').value;
  if (nick.length < 2) return toast('닉네임은 2자 이상!');
  if (nick.includes('|')) return toast('닉네임에 | 는 못 써');
  if (pw.length < 4) return toast('비밀번호는 4자 이상!');
  const btn = $('#siGo'); busy(btn, '만드는 중...');
  try {
    const data = Object.assign({}, DEFAULT_SAVE, { nick, num: Math.floor(Math.random() * 9000) + 1000, avatar: siAvatarData || emojiAvatar('👔'), pw: await hashPw(pw), created: Date.now(), lastHunt: Date.now(), updatedAt: Date.now() });
    const id = await apiCreateNamed(data, BIN_PREFIX + nick);
    data.binId = id;
    enterAccount(data, id, '✨ ' + nick + ' 환영해!');
  } catch (e) { toast('❌ 서버 오류: ' + e.message); }
  unbusy(btn);
});

$('#liGo').addEventListener('click', async () => {
  const nick = $('#liNick').value.trim(), pw = $('#liPw').value;
  if (!nick) return toast('닉네임을 입력해');
  const btn = $('#liGo'); busy(btn, '찾는 중...');
  try {
    const ids = await findBinsByName(BIN_PREFIX + nick);
    if (!ids.length) { toast('❌ 그 닉네임의 계정이 없어'); unbusy(btn); return; }
    const h = await hashPw(pw);
    let ok = null;
    for (const id of ids) { try { const d = await apiRead(id); if ((d.pw || '') === h || (!d.pw && !pw)) { ok = { d, id }; break; } } catch (e) {} }
    if (!ok) { toast('❌ 비밀번호가 틀렸어'); unbusy(btn); return; }
    enterAccount(ok.d, ok.id, '✅ ' + ok.d.nick + '님 환영!');
  } catch (e) { toast('❌ 서버 오류: ' + e.message); }
  unbusy(btn);
});

// ---------- 계정 화면 ----------
let acAvatarData = '';
function showAccount() {
  const box = $('#acBox');
  const st = S.stats || {};
  box.innerHTML = `
    <h2 style="text-align:center">👤 내 계정</h2>
    <div class="row" style="justify-content:center;margin-bottom:10px"><img src="${S.avatar || emojiAvatar('👔')}" class="avprev" style="width:80px;height:80px"><div><div style="font-size:18px;font-weight:bold;color:#ffd84a">${S.nick}</div><div class="small">#${String(S.num).padStart(4,'0')} · 가입 ${S.created ? new Date(S.created).toLocaleDateString('ko-KR') : '-'}</div><div class="small">🏆 ${(S.achievements||[]).length}/${Object.keys(ACHIEVEMENTS).length} · 클리어 ${S.clears||0}회 · 처치 ${(st.totalKills||0).toLocaleString('ko-KR')}</div></div></div>

    <div class="card" style="margin-bottom:10px"><h3>✏️ 닉네임 변경</h3><input id="acNick" class="inp" value="${S.nick}" maxlength="12" style="margin-bottom:6px"><div class="btn blue" id="acNickSave">저장</div></div>

    <div class="card" style="margin-bottom:10px"><h3>🖼️ 아바타 변경</h3><div class="avgrid" id="acAvGrid"></div><div class="row" style="margin-top:6px"><img id="acAvPrev" class="avprev" src=""><input type="file" id="acFile" accept="image/*" style="flex:1;font-size:12px;color:#ccc"></div><div class="btn blue" id="acAvSave">저장</div></div>

    <div class="card" style="margin-bottom:10px"><h3>🔒 비밀번호 변경</h3>
      <div class="pwwrap"><input id="acPw0" class="inp" type="password" placeholder="기존 비밀번호"><span class="eye" data-for="acPw0">👁️</span></div>
      <div class="pwwrap"><input id="acPw1" class="inp" type="password" placeholder="새 비밀번호 (4자 이상)"><span class="eye" data-for="acPw1">👁️</span></div>
      <div class="pwwrap"><input id="acPw2" class="inp" type="password" placeholder="새 비밀번호 확인"><span class="eye" data-for="acPw2">👁️</span></div>
      <div class="btn blue" id="acPwSave">변경</div></div>

    <div class="row" style="gap:8px"><div class="btn" id="acLogout" style="background:#a33;flex:1;text-align:center">로그아웃</div><div class="btn" id="acClose" style="background:#555;flex:1;text-align:center">닫기</div></div>`;
  showOv('ovAccount');
  acAvatarData = S.avatar;
  buildAvGrid($('#acAvGrid'), $('#acAvPrev'), d => acAvatarData = d);
  $('#acAvGrid').querySelectorAll('img').forEach(i => i.classList.remove('sel')); $('#acAvPrev').src = S.avatar || emojiAvatar('👔'); acAvatarData = S.avatar;
  wireFile($('#acFile'), $('#acAvGrid'), $('#acAvPrev'), d => acAvatarData = d);

  $('#acClose').addEventListener('click', () => hideOv('ovAccount'));
  $('#acNickSave').addEventListener('click', async () => {
    const nick = $('#acNick').value.trim();
    if (nick.length < 2) return toast('닉네임은 2자 이상!'); if (nick.includes('|')) return toast('| 는 못 써'); if (nick === S.nick) return toast('같은 닉네임이야');
    const btn = $('#acNickSave'); busy(btn, '저장 중...');
    try { await apiRename(S.binId, BIN_PREFIX + nick); S.nick = nick; save(); updateProfileBar(); toast('닉네임 변경 완료!'); showAccount(); } catch (e) { toast('❌ 실패: ' + e.message); unbusy(btn); }
  });
  $('#acAvSave').addEventListener('click', () => { if (!acAvatarData) return; S.avatar = acAvatarData; save(); updateProfileBar(); toast('아바타 변경 완료!'); showAccount(); });
  $('#acPwSave').addEventListener('click', async () => {
    const p0 = $('#acPw0').value, p1 = $('#acPw1').value, p2 = $('#acPw2').value;
    if (S.pw && (await hashPw(p0)) !== S.pw) return toast('❌ 기존 비밀번호가 틀렸어');
    if (p1.length < 4) return toast('새 비밀번호는 4자 이상!');
    if (p1 !== p2) return toast('❌ 새 비밀번호 두 개가 달라');
    S.pw = await hashPw(p1); save(); toast('🔒 비밀번호 변경 완료!'); showAccount();
  });
  let ar = false;
  $('#acLogout').addEventListener('click', () => { const b = $('#acLogout'); if (!ar) { ar = true; b.textContent = '진짜? 다시 누르면 로그아웃'; return; } clearTimeout(syncTimer); if (S.binId) apiUpdate(S.binId, S).catch(()=>{}); localStorage.removeItem(BIN_ID_KEY); localStorage.removeItem(SAVE_KEY); S = Object.assign({}, DEFAULT_SAVE); showOv('ovStart'); });
}
