<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>K-사냥맨</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; user-select: none; }
  html, body { width: 100%; height: 100%; background: #0b0b14; color: #fff; font-family: "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif; overflow: hidden; }
  #app { position: relative; width: 100%; height: 100%; max-width: 520px; margin: 0 auto; background: #12121f; overflow: hidden; }

  /* ---------- 홈 화면 ---------- */
  #home { position: absolute; inset: 0; display: flex; flex-direction: column; }
  #topbar { display: flex; gap: 6px; padding: 10px 10px 6px; background: #0b0b14; border-bottom: 3px solid #2a2a44; font-size: 13px; }
  .res { flex: 1; background: #1c1c30; border: 2px solid #3a3a5c; padding: 5px 6px; text-align: center; white-space: nowrap; }
  .res b { color: #ffd84a; }
  #tabcontent { flex: 1; overflow-y: auto; padding: 14px; }
  #tabs { display: flex; height: 62px; background: #0b0b14; border-top: 3px solid #2a2a44; }
  .tab { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 12px; color: #8a8ab0; cursor: pointer; gap: 3px; }
  .tab .ico { font-size: 22px; }
  .tab.active { color: #ffd84a; background: #1c1c30; }
  .tab.home-tab .ico { font-size: 28px; }
  h2 { font-size: 20px; color: #7CFC7C; margin-bottom: 10px; text-shadow: 2px 2px 0 #000; letter-spacing: 1px; }
  .card { background: #1c1c30; border: 3px solid #3a3a5c; padding: 12px; margin-bottom: 12px; box-shadow: 4px 4px 0 #000; }
  .card h3 { font-size: 15px; color: #ffd84a; margin-bottom: 6px; }
  .card p { font-size: 13px; color: #c8c8e0; line-height: 1.5; }
  .btn { display: inline-block; background: #3b8f3b; color: #fff; border: 3px solid #fff; padding: 10px 18px; font-size: 15px; font-weight: bold; cursor: pointer; box-shadow: 3px 3px 0 #000; margin-top: 8px; }
  .btn:active { transform: translate(2px,2px); box-shadow: 1px 1px 0 #000; }
  .btn.big { width: 100%; padding: 16px; font-size: 20px; background: #d9432f; text-align: center; }
  .btn.gold { background: #b58a1c; }
  .btn.blue { background: #2f6fd9; }
  .btn.gray, .btn:disabled, .btn.disabled { background: #444; color: #999; cursor: not-allowed; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .pixel-title { font-size: 34px; font-weight: 900; color: #7CFC7C; text-shadow: 4px 4px 0 #000, -2px -2px 0 #1a4d1a; letter-spacing: 2px; text-align: center; margin: 10px 0 4px; }
  .sub { text-align: center; color: #8a8ab0; font-size: 13px; margin-bottom: 14px; }
  #heroCanvas { display: block; margin: 0 auto 8px; image-rendering: pixelated; background: #1a2a1a; border: 3px solid #3a5c3a; }
  .stat { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px dashed #3a3a5c; }
  .stars { color: #ffd84a; font-size: 18px; letter-spacing: 2px; }
  .bar { height: 14px; background: #0b0b14; border: 2px solid #3a3a5c; margin: 6px 0; position: relative; }
  .bar > div { height: 100%; background: #7CFC7C; }
  .shop-item { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .shop-item .ico { font-size: 30px; }
  .small { font-size: 12px; color: #8a8ab0; }
  .toggle { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px dashed #3a3a5c; font-size: 15px; }
  .sw { width: 54px; height: 28px; background: #444; border: 2px solid #fff; position: relative; cursor: pointer; }
  .sw.on { background: #3b8f3b; }
  .sw::after { content: ''; position: absolute; top: 2px; left: 2px; width: 20px; height: 20px; background: #fff; transition: left .15s; }
  .sw.on::after { left: 28px; }
  .skilltbl { width: 100%; font-size: 12px; border-collapse: collapse; }
  .skilltbl td { padding: 4px 3px; border-bottom: 1px solid #2a2a44; vertical-align: top; }
  .skilltbl td:first-child { white-space: nowrap; color: #ffd84a; }
  .hidden { display: none !important; }
  .toast { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); background: #000; color: #ffd84a; border: 3px solid #ffd84a; padding: 10px 16px; font-weight: bold; font-size: 14px; z-index: 50; white-space: nowrap; box-shadow: 4px 4px 0 #000; pointer-events: none; }

  /* ---------- 전투 화면 ---------- */
  #battle { position: absolute; inset: 0; background: #000; }
  #game { display: block; width: 100%; height: 100%; image-rendering: pixelated; touch-action: none; }
  #hud { position: absolute; top: 0; left: 0; right: 0; padding: 8px 10px; pointer-events: none; }
  #hpbar { height: 16px; background: #300; border: 2px solid #fff; position: relative; }
  #hpfill { height: 100%; background: #e33; }
  #gembar { height: 10px; background: #013; border: 2px solid #fff; margin-top: 4px; position: relative; }
  #gemfill { height: 100%; background: #4af; }
  #hudtxt { display: flex; justify-content: space-between; font-size: 12px; margin-top: 4px; text-shadow: 1px 1px 0 #000; }
  #timer { position: absolute; top: 56px; left: 50%; transform: translateX(-50%); font-size: 22px; font-weight: 900; text-shadow: 2px 2px 0 #000; pointer-events: none; }
  #skillrow { position: absolute; top: 58px; left: 10px; display: flex; gap: 4px; flex-wrap: wrap; max-width: 60%; pointer-events: none; }
  .sk { width: 34px; height: 34px; background: rgba(0,0,0,.65); border: 2px solid #888; font-size: 17px; display: flex; align-items: center; justify-content: center; position: relative; }
  .sk .lv { position: absolute; bottom: -2px; right: -2px; background: #000; color: #ffd84a; font-size: 9px; padding: 0 2px; font-weight: bold; }
  .sk.def { border-color: #4af; }
  .sk.sup { border-color: #ffd84a; box-shadow: 0 0 8px #ffd84a; }
  #superBtn { position: absolute; right: 14px; bottom: 90px; width: 74px; height: 74px; border-radius: 50%; background: radial-gradient(#ff8a2a, #b52a00); border: 4px solid #fff; font-size: 30px; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 0 0 4px #000; overflow: hidden; }
  #superBtn.cd { filter: grayscale(1) brightness(.6); }
  #superBtn .cdtxt { position: absolute; font-size: 22px; font-weight: 900; color: #fff; text-shadow: 2px 2px 0 #000; }
  #pauseBtn { position: absolute; top: 8px; right: 10px; width: 34px; height: 34px; background: rgba(0,0,0,.7); border: 2px solid #fff; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; pointer-events: auto; }

  /* ---------- 오버레이 ---------- */
  .overlay { position: absolute; inset: 0; background: rgba(0,0,0,.82); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 16px; z-index: 40; }

  .overlay > :first-child { margin-top: auto; }
  .overlay > :last-child { margin-bottom: auto; }
  .overlay h2 { text-align: center; flex-shrink: 0; }
  .opts { display: flex; flex-direction: column; gap: 10px; width: 100%; max-width: 380px; flex-shrink: 0; padding-bottom: 10px; }
  .opt { flex-shrink: 0; }
  .opt { background: #1c1c30; border: 3px solid #3a3a5c; padding: 12px; cursor: pointer; display: flex; gap: 12px; align-items: center; box-shadow: 4px 4px 0 #000; }

  .opt.atk { border-color: #e55; }
  .opt.def { border-color: #4af; }
  .opt.heal { border-color: #7CFC7C; }
  .opt .ico { font-size: 34px; width: 44px; text-align: center; }
  .opt .nm { font-size: 16px; font-weight: bold; color: #ffd84a; }
  .opt .ds { font-size: 12px; color: #c8c8e0; margin-top: 3px; line-height: 1.4; }
  .opt .tag { font-size: 11px; padding: 1px 5px; border: 1px solid; margin-left: 6px; }
  .result-box { background: #1c1c30; border: 4px solid #ffd84a; padding: 20px; width: 100%; max-width: 380px; box-shadow: 6px 6px 0 #000; text-align: center; }
  .result-box h2 { font-size: 30px; margin-bottom: 12px; }
  .result-box .line { font-size: 16px; padding: 4px 0; }
</style>
</head>
<body>
<div id="app">

  <!-- ============ 홈 ============ -->
  <div id="home">
    <div id="topbar">
      <div class="res">🪙 <b id="rCoin">0</b></div>
      <div class="res">🪱 <b id="rWorm">0</b></div>
      <div class="res">🧩 <b id="rPuz">0</b></div>
    </div>
    <div id="tabcontent"></div>
    <div id="tabs">
      <div class="tab" data-tab="shop"><span class="ico">🏪</span>상점</div>

    <canvas id="game"></canvas>

      <div id="gembar"><div id="gemfill"></div></div>
      <div id="hudtxt"><span id="hpTxt">HP</span><span id="killTxt">처치 0</span></div>

<script>
'use strict';
// =====================================================================
//  K-사냥맨  — 사마귀 히어로 서바이벌 (1챕터)
// =====================================================================

// ---------------- 저장 ----------------
const SAVE_KEY = 'k_sanyangman_save_v1';
const DEFAULT_SAVE = { coins: 0, worm: 0, puzzle: 0, upLv: 0, star: 0, lastHunt: Date.now(), bgm: true, sfx: true, clears: 0, best: 0 };
let S = loadSave();
function loadSave() {
  try { const raw = localStorage.getItem(SAVE_KEY); if (raw) return Object.assign({}, DEFAULT_SAVE, JSON.parse(raw)); } catch (e) {}
  return Object.assign({}, DEFAULT_SAVE);
}
function save() { try { localStorage.setItem(SAVE_KEY, JSON.stringify(S)); } catch (e) {} }

// ---------------- 데이터 ----------------
const STAR_COST = [30, 50, 70, 100, 120, 150];
const STAR_DESC = ['기본 능력', '공격/체력 대폭 상승', '연속 슈퍼 펀치 범위 증가', '공격/체력 대폭 상승', '연속 슈퍼 펀치 공격력 대폭 상승', '모든 캐릭터 체력 +20%, 사마맨 +40%'];
const MAX_ATK = 4, MAX_DEF = 3;

const ATTACKS = {

  kick:  { name: '뒷발 펀치',      ico: '🦵', def: 'shoes',    desc: '뒤로 차기. 정확성이 낮아 가끔 빗나감.', sup: '슈퍼 뒷발: 정확성 대폭 상승, 아슬아슬해도 맞음!' },
  jump:  { name: '사마귀 점프',    ico: '🦗', def: 'wing',     desc: '높이 뛰어 착지할 때 충격파.', sup: '슈퍼 점프: 공격력 +20%!' },
  bite:  { name: '입 공격',        ico: '👄', def: 'magnet',   desc: '앞의 적을 강하게 물기.', sup: '슈퍼 입: 체력 40% 이하 적 즉사! (보스 제외)' },
  head:  { name: '머리박치기',     ico: '💥', def: 'mealworm', desc: '앞으로 돌진! 돌진 중에는 무적.', sup: '슈퍼 머리: 공격력 +20%!' },
};
const DEFS = {
  glove:    { name: '장갑',   ico: '🧤', atk: 'claw', desc: '앞발 공격 치명타 확률 +10%' },
  shoes:    { name: '신발',   ico: '👟', atk: 'kick', desc: '뒷발 펀치 치명타 확률 +10%' },
  wing:     { name: '날개',   ico: '🪽', atk: 'jump', desc: '사마귀 점프 범위 +10%' },
  magnet:   { name: '입 자석', ico: '🧲', atk: 'bite', desc: '보석 흡수 범위 +10%' },
  mealworm: { name: '밀웜',   ico: '🪱', atk: 'head', desc: '사마귀와 무기 크기 +10%' },
};

// 몬스터 (1챕터)
const ENEMIES = {
  larva:  { name: '애벌레',     hp: 22,  spd: 42,  dmg: 5,  strong: false, size: 10, col: '#b9e03a', eye: '#000' },
  worm:   { name: '지렁이',     hp: 30,  spd: 50,  dmg: 6,  strong: false, size: 10, col: '#e88aa0', eye: '#000' },
  ant:    { name: '개미',       hp: 16,  spd: 95,  dmg: 5,  strong: false, size: 9,  col: '#5a3a1e', eye: '#fff' },
  fly:    { name: '파리',       hp: 12,  spd: 115, dmg: 4,  strong: false, size: 9,  col: '#8a8a9a', eye: '#f33', erratic: true },
  beetle: { name: '장수풍뎅이', hp: 130, spd: 45,  dmg: 12, strong: true,  size: 15, col: '#6b3a1a', eye: '#ffd84a' },
  stag:   { name: '사슴벌레',   hp: 100, spd: 55,  dmg: 18, strong: true,  size: 15, col: '#2a1a0a', eye: '#f55' },
  mosq:   { name: '모기',       hp: 45,  spd: 135, dmg: 8,  strong: true,  size: 11, col: '#4a4a6a', eye: '#f00', erratic: true },
  cicada: { name: '매미',       hp: 90,  spd: 70,  dmg: 10, strong: true,  size: 14, col: '#3a6a3a', eye: '#ffd84a' },
};
const NORMAL = ['larva', 'worm', 'ant', 'fly'];
const STRONG = ['beetle', 'stag', 'mosq', 'cicada'];

// 픽셀 스프라이트 (문자 → 색)
const SPR = {
  mantis: { pal: { G: '#3fbf3f', D: '#237a23', E: '#ffffff', P: '#000000', C: '#8ff08f' }, rows: [
    '..........GG..',
    '.........GEPG.',
    '........GGGGCC',
    '.......GGG..C.',
    '....GGGGG.....',
    '..GGGGGGD.....',
    '.GGGGGGDD.....',
    '..DG.DG.DG....',
    '.D..D..D..D...',
  ]},
  larva: { pal: { B: '#b9e03a', D: '#7fa020', E: '#000' }, rows: ['.BBBBBB.', 'BBDBBDBE', 'BBBBBBBB', '.B.B.B..'] },
  worm:  { pal: { B: '#e88aa0', D: '#b05070', E: '#000' }, rows: ['BBBBBBBE', 'BDBBDBBB', '.BBBBBB.'] },
  ant:   { pal: { B: '#5a3a1e', D: '#2a1a0a', E: '#fff' }, rows: ['.BB.BB.BE', 'BBBBBBBBB', '.D.D.D.D.'] },
  fly:   { pal: { B: '#8a8a9a', W: '#d0d0ff', E: '#f33' }, rows: ['W.W...W.W', '.WWWBBWWW', '..BBBBBE.', '...BBBB..'] },
  beetle:{ pal: { B: '#6b3a1a', D: '#3a1a0a', E: '#ffd84a', H: '#222' }, rows: ['....BBB..H', '..BBBBBBHH', '.BBDDDBBB.', 'BBDDDDDBBE', '.BBDDDBBB.', '..D.D.D.D.'] },
  stag:  { pal: { B: '#2a1a0a', D: '#000', E: '#f55', H: '#553' }, rows: ['.......H.H', '..BBBB.HHH', '.BBBBBBBHE', 'BBBDDDBBB.', '.BBBBBBBB.', '..D.D.D.D.'] },
  mosq:  { pal: { B: '#4a4a6a', W: '#aac', E: '#f00', N: '#ccc' }, rows: ['W.W....', '.WWBB..', '..BBBEN', '..BB..N'] },
  cicada:{ pal: { B: '#3a6a3a', W: '#9c9', E: '#ffd84a' }, rows: ['..BBBB..', '.BBBBBBE', 'WBBBBBBW', 'WWBBBBWW', '.WW..WW.'] },
  bee:   { pal: { Y: '#ffd84a', K: '#111', W: '#dfe', E: '#f00', S: '#ccc' }, rows: [
    '....WWWW......',
    '..WWWWWWWW....',
    'S.YYKKYYKKYYE.',
    'SSYYKKYYKKYYEE',
    'S.YYKKYYKKYYE.',
    '..WWWWWWWW....',
    '....K.K.K.....',
  ]},
};

// ---------------- 유틸 ----------------
const $ = s => document.querySelector(s);
const rnd = (a, b) => a + Math.random() * (b - a);
const ri = (a, b) => Math.floor(rnd(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
function fmt(n) { return n.toLocaleString('ko-KR'); }
function fmtTime(sec) { sec = Math.max(0, Math.floor(sec)); return String(Math.floor(sec / 60)).padStart(2, '0') + ':' + String(sec % 60).padStart(2, '0'); }
let toastT = null;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.remove('hidden'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.add('hidden'), 1800); }

function drawSprite(ctx, spr, x, y, scale, flip) {
  const rows = spr.rows, h = rows.length, w = rows[0].length;
  const ox = x - (w * scale) / 2, oy = y - (h * scale) / 2;
  for (let r = 0; r < h; r++) for (let c = 0; c < w; c++) {
    const ch = rows[r][c]; if (ch === '.') continue;
    const col = spr.pal[ch]; if (!col) continue;
    ctx.fillStyle = col;
    const cx = flip ? (w - 1 - c) : c;
    ctx.fillRect(Math.round(ox + cx * scale), Math.round(oy + r * scale), Math.ceil(scale), Math.ceil(scale));
  }
}

// ---------------- 캐릭터 능력치 ----------------
function heroStats() {
  let atk = 14 + S.upLv * 2, hp = 200 + S.upLv * 25;
  if (S.star >= 2) { atk *= 1.3; hp *= 1.3; }
  if (S.star >= 4) { atk *= 1.3; hp *= 1.3; }
  if (S.star >= 6) { hp *= 1.4; }
  return { atk: Math.round(atk), hp: Math.round(hp) };
}
function upgradeCost() { return 300 + S.upLv * 100; }

// =====================================================================
//  홈 화면 / 탭
// =====================================================================
let curTab = 'home';
function refreshRes() { $('#rCoin').textContent = fmt(S.coins); $('#rWorm').textContent = fmt(S.worm); $('#rPuz').textContent = fmt(S.puzzle); }
function showTab(t) {
  curTab = t;
  document.querySelectorAll('.tab').forEach(el => el.classList.toggle('active', el.dataset.tab === t));
  const c = $('#tabcontent'); c.innerHTML = '';
  refreshRes();
  ({ home: renderHome, shop: renderShop, squad: renderSquad, hunt: renderHunt, settings: renderSettings })[t](c);
}
document.querySelectorAll('.tab').forEach(el => el.addEventListener('click', () => { audio.init(); showTab(el.dataset.tab); }));

function renderHome(c) {
  const st = heroStats();
  c.innerHTML = `
    <div class="pixel-title">K-사냥맨</div>
    <div class="sub">서울을 지키는 사마귀 히어로 🦗</div>
    <canvas id="heroCanvas" width="160" height="110"></canvas>
    <div class="card">

const audio = {
  ctx: null, bgmOn: false, nextNote: 0, step: 0, timer: null, gain: null,
  melody: [392, 392, 440, 392, 523, 494, 0, 392, 392, 440, 392, 587, 523, 0, 392, 392, 784, 659, 523, 494, 440, 0, 698, 698, 659, 523, 587, 523, 0, 0],
  bass:   [196, 0, 196, 0, 262, 0, 262, 0, 196, 0, 196, 0, 294, 0, 294, 0, 196, 0, 196, 0, 330, 0, 330, 0, 175, 0, 175, 0, 196, 0],
  init() { if (this.ctx) return; try { this.ctx = new (window.AudioContext || window.webkitAudioContext)(); this.gain = this.ctx.createGain(); this.gain.gain.value = .12; this.gain.connect(this.ctx.destination); } catch (e) {} },
  tone(freq, t, dur, type, vol) { if (!this.ctx || !freq) return; const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.type = type; o.frequency.value = freq; g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur); o.connect(g); g.connect(this.gain); o.start(t); o.stop(t + dur + .02); },
  startBgm() { this.init(); if (!this.ctx) return; this.bgmOn = true; this.nextNote = this.ctx.currentTime + .05; this.step = 0; clearInterval(this.timer); this.timer = setInterval(() => this.schedule(), 60); this.updateBgm(); },
  stopBgm() { this.bgmOn = false; clearInterval(this.timer); },
  updateBgm() { if (this.ctx) this.ctx.resume && this.ctx.resume(); },
  schedule() {
    if (!this.bgmOn || !S.bgm || !this.ctx) return;
    const stepDur = 0.16;
    while (this.nextNote < this.ctx.currentTime + 0.2) {
      const i = this.step % this.melody.length;
      this.tone(this.melody[i], this.nextNote, stepDur * .9, 'square', .5);
      this.tone(this.bass[i], this.nextNote, stepDur * .8, 'triangle', .7);
      this.nextNote += stepDur; this.step++;
    }
  },
  punchSfx() {
    if (!S.sfx) return; this.init(); if (!this.ctx) return;
    const t = this.ctx.currentTime;
    for (let i = 0; i < 5; i++) { this.tone(220 - i * 20, t + i * .18, .12, 'sawtooth', 1.2); this.tone(880 + i * 60, t + i * .18, .06, 'square', .6); }
    this.tone(110, t + 1.0, .5, 'sawtooth', 1.5);
  },
};

function optionPool() {
  const pool = [];
  const nAtk = Object.keys(run.skills).length, nDef = Object.keys(run.defs).length;
  for (const k in ATTACKS) {
    if (run.skills[k]) { if (!run.sup[k] && run.skills[k] < 5) pool.push({ type: 'atk', key: k }); }
    else if (k !== 'punch' && nAtk < MAX_ATK) pool.push({ type: 'atk', key: k });
  }
  for (const k in DEFS) {
    if (run.defs[k]) { if (run.defs[k] < 5) pool.push({ type: 'def', key: k }); }
    else if (nDef < MAX_DEF) pool.push({ type: 'def', key: k });
  }
  return pool;
}
function showPick(title, count) {
  if (!run || run.over) return;
  run.paused = true; run.pendingPicks = count; run.pickTitle = title;
  renderPick();
}
function renderPick() {
  const pool = optionPool();
  let opts;
  if (run.pendingPicks >= 2 || run.pickTitle.includes('미니보스')) opts = pool; // 미니보스: 전체에서 원하는 거 고르기
  else { opts = []; const cp = pool.slice(); while (opts.length < 3 && cp.length) opts.push(cp.splice(Math.floor(Math.random() * cp.length), 1)[0]); }
  if (!opts.length) opts.push({ type: 'heal' });
  else if (opts.length < 3 && !run.pickTitle.includes('미니보스')) opts.push({ type: 'heal' });
  $('#ovLevelTitle').textContent = run.pickTitle + (run.pendingPicks > 1 ? ` (${run.pendingPicks}개 남음)` : '');
  const box = $('#ovLevelOpts'); box.innerHTML = '';
  opts.forEach(o => {
    const el = document.createElement('div');
    if (o.type === 'heal') { el.className = 'opt heal'; el.innerHTML = `<div class="ico">❤️</div><div><div class="nm">체력 회복</div><div class="ds">체력을 50% 회복한다.</div></div>`; }
    else if (o.type === 'atk') {
      const a = ATTACKS[o.key], lv = run.skills[o.key] || 0;
      const willSup = lv === 4 && a.def && run.defs[a.def];
      el.className = 'opt atk'; el.innerHTML = `<div class="ico">${a.ico}</div><div><div class="nm">${a.name} <span class="tag" style="color:#e55">${lv ? `Lv.${lv} → ${willSup ? '슈퍼!' : 'Lv.' + (lv + 1)}` : 'NEW'}</span></div><div class="ds">${lv ? (willSup ? '🔥 돌파! ' + a.sup : '공격력 +20%') : a.desc}${a.def ? `<br><span style="color:#4af">돌파 조합: ${DEFS[a.def].ico} ${DEFS[a.def].name}</span>` : ''}</div></div>`;
    } else {

    if (e.hitT > 0) { ctx.save(); ctx.filter = 'brightness(3)'; drawSprite(ctx, spr, x, y + (e.erratic ? Math.sin(e.wob * 3) * 3 : 0), scale, flip); ctx.restore(); }
    else drawSprite(ctx, spr, x, y + (e.erratic ? Math.sin(e.wob * 3) * 3 : 0), scale, flip);
    if (e.mini || e.boss) { const w = e.boss ? 120 : 60, hh = e.boss ? 10 : 6; ctx.fillStyle = '#000'; ctx.fillRect(x - w / 2, y - e.size - 12, w, hh); ctx.fillStyle = e.boss ? '#f33' : '#fa3'; ctx.fillRect(x - w / 2, y - e.size - 12, w * (e.hp / e.maxHp), hh); if (e.boss) { ctx.fillStyle = '#fff'; ctx.font = 'bold 12px sans-serif'; ctx.textAlign = 'center'; ctx.fillText('독벌', x, y - e.size - 16); ctx.textAlign = 'left'; } }
  }
  // 이펙트
  for (const f of run.fx) {
    if (f.slash) { ctx.save(); ctx.globalAlpha = f.t / .15; ctx.strokeStyle = f.col; ctx.lineWidth = 4; ctx.beginPath(); ctx.arc(f.x - camX, f.y - camY, f.r, f.a - .9, f.a + .9); ctx.stroke(); ctx.restore(); }
    else if (f.ring) { ctx.save(); ctx.globalAlpha = f.t / .3; ctx.strokeStyle = f.col; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(f.x - camX, f.y - camY, f.r * (1 - f.t / .3 * .3), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
    else { ctx.fillStyle = f.col; ctx.fillRect(f.x - camX - f.r / 2, f.y - camY - f.r / 2, f.r, f.r); }
  }
  // 플레이어
  const px = W / 2, py = H / 2; let pyOff = 0;
  if (run.jumpState) { const j = run.jumpState, f = 1 - j.t / j.dur; pyOff = -Math.sin(f * Math.PI) * 50; }
  if (p.inv > 0 && Math.floor(p.inv * 20) % 2 === 0 && !run.dash && !run.jumpState) ctx.globalAlpha = .4;
  if (run.dash) { ctx.save(); ctx.globalAlpha = .35; drawSprite(ctx, SPR.mantis, px - run.dash.dx * 18, py - run.dash.dy * 18, 3 * sm, p.facing < 0); ctx.restore(); }
  drawSprite(ctx, SPR.mantis, px, py + pyOff, 3 * sm, p.facing < 0);
  ctx.globalAlpha = 1;
  if (run.superActive > 0) { ctx.save(); ctx.strokeStyle = '#f80'; ctx.lineWidth = 3; ctx.globalAlpha = .6; ctx.beginPath(); ctx.arc(px, py, 135 * sm * (S.star >= 3 ? 1.5 : 1), 0, Math.PI * 2); ctx.stroke(); ctx.restore(); }
  // 텍스트
  ctx.textAlign = 'center';
  for (const t of run.texts) { ctx.globalAlpha = clamp(t.t / .3, 0, 1); ctx.font = (t.big ? 'bold 18px' : 'bold 13px') + ' sans-serif'; ctx.fillStyle = '#000'; ctx.fillText(t.txt, t.x - camX + 1, t.y - camY + 1); ctx.fillStyle = t.col; ctx.fillText(t.txt, t.x - camX, t.y - camY); }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';
  // 조이스틱
  if (run.input.active) { ctx.save(); ctx.globalAlpha = .35; ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(run.input.sx, run.input.sy, 40, 0, Math.PI * 2); ctx.stroke(); const dx = run.input.cx - run.input.sx, dy = run.input.cy - run.input.sy, l = Math.hypot(dx, dy) || 1, cl = Math.min(l, 40); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(run.input.sx + dx / l * cl, run.input.sy + dy / l * cl, 16, 0, Math.PI * 2); ctx.fill(); ctx.restore(); }

  // HUD
  $('#hpfill').style.width = (p.hp / p.maxHp * 100) + '%';
  $('#gemfill').style.width = (run.gems / run.gemNeed * 100) + '%';
  $('#hpTxt').textContent = `❤️ ${Math.ceil(p.hp)} / ${p.maxHp}`;
  $('#killTxt').textContent = `👾 처치 ${run.kills}  💎 ${run.gems}/${run.gemNeed}`;
  $('#timer').textContent = run.phase === 'boss' ? 'BOSS' : fmtTime(RUN_LEN - run.t);
  const sb = $('#superBtn'); if (run.superCd > 0) { sb.classList.add('cd'); sb.querySelector('.cdtxt').textContent = Math.ceil(run.superCd); } else { sb.classList.remove('cd'); sb.querySelector('.cdtxt').textContent = ''; }
}

function loop(now) {
  if (!run) return;
  raf = requestAnimationFrame(loop);
  let dt = (now - lastT) / 1000; lastT = now; if (dt > .05) dt = .05;
  if (!run.paused && !run.over) update(dt);
  if (run) draw();
}

// ---------------- 시작 ----------------
showTab('home');
</script>
</body>
</html>
